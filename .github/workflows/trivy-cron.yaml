---
name: Docker Image Trivy Image Vulnerability Scan Cron Job
on:
  schedule:
    # Runs "at 2 a.m. past every day" (see https://crontab.guru)
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  # required for all workflows
  security-events: write
  # only required for workflows in private repositories
  actions: read
  contents: read

# Template Single Image Repro GHA
jobs:
  trivy_image_scan_cron:
    uses: dbildungsplattform/infra-tools/.github/workflows/trivy-scan.yaml@a4994d155f9305d46bc6e0c0144d82648f8427a3 # version used as does not require contents: write permissions
    with:
      image-ref: 'ghcr.io/dbildungsplattform/infra-sshd:latest'
